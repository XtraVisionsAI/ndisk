[workspace]
resolver = "3"
members = [
    "crates/ndisk-core",
    "crates/ndisk-backend-s3",
    "crates/ndisk-cli",
    "crates/ndisk-fuse",
    "crates/ndisk-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/XtraVisonsAI/ndisk"
rust-version = "1.93"

[workspace.dependencies]
ndisk-core = { path = "crates/ndisk-core" }
ndisk-backend-s3 = { path = "crates/ndisk-backend-s3" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
async-trait = "0.1"
bytes = "1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
