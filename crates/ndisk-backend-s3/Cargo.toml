[package]
name = "ndisk-backend-s3"
description = "S3 (and S3-compatible) backend for ndisk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ndisk-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
aws-config = { version = "1", features = ["behavior-version-latest", "sso"] }
# 不启用默认的 `rustls` feature：它带入旧版 hyper 0.14 / rustls 0.21 栈（有未修复的安全公告）。
# 新版 hyper 1 + rustls 0.23 客户端由 `default-https-client` 提供，代理客户端也基于它。
# 也不启用 `sigv4a`：它只用于 S3 多区域访问点，却带入 crypto-bigint 0.5（RUSTSEC-2026-0387，
# 修复只在 0.7.6+）；普通 Bucket 与 S3 兼容服务都只用 SigV4。
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
serde_json = { workspace = true }
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
