[package]
name = "ndisk-backend-s3"
description = "S3 (and S3-compatible) backend for ndisk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ndisk-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
aws-config = { version = "1", features = ["behavior-version-latest", "sso"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
serde_json = { workspace = true }
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
