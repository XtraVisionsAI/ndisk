[package]
name = "ndisk-backend-s3"
description = "S3 (and S3-compatible) backend for ndisk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ndisk-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
aws-config = { version = "1", features = ["behavior-version-latest", "sso"] }
# 不启用默认的 `rustls` feature：它带入旧版 hyper 0.14 / rustls 0.21 栈（有未修复的安全公告）。
# 新版 hyper 1 + rustls 0.23 客户端由 `default-https-client` 提供，代理客户端也基于它。
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["behavior-version-latest", "sigv4a", "default-https-client", "rt-tokio"] }
serde_json = { workspace = true }
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
