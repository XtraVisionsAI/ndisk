[package]
name = "ndisk-ffi"
description = "FFI surface (UniFFI) consumed by the macOS File Provider extension and desktop apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "ndisk_ffi"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

[dependencies]
ndisk-core = { workspace = true }
ndisk-backend-s3 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
uniffi = { version = "0.32", features = ["cli"] }   # MPL-2.0
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
